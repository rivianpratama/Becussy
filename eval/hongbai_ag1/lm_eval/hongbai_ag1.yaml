# Hongbai-AG1 as an lm-evaluation-harness task.
#
# Lets anyone run the eval against any harness-supported model without the
# scripts in this directory:
#
#   lm_eval --model hf \
#           --model_args pretrained=Qwen/Qwen3-4B-Instruct-2507,peft=<adapter> \
#           --include_path eval/hongbai_ag1/lm_eval \
#           --tasks hongbai_ag1 \
#           --gen_kwargs max_gen_toks=220,do_sample=False
#
# The harness reports the plain micro accuracy over all 120 items. That is NOT
# the headline AG1 number: AG1 macro-averages within language groups and weights
# the ten untrained languages at 0.10 (see ../README.md). `metric_list` below
# exposes the five clauses so the breakdown survives, but for the composite,
# run grade.py — the harness has no notion of weighted language groups.
task: hongbai_ag1
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: ../../../dataset/prompts/hongbai_ag1.jsonl
test_split: test
output_type: generate_until
doc_to_text: "{{prompt}}"
doc_to_target: ""
process_docs: !function utils.process_docs
generation_kwargs:
  max_gen_toks: 220
  do_sample: false
  until:
    - "=== ITEM"
process_results: !function utils.process_results
metric_list:
  - metric: ag1_pass
    aggregation: mean
    higher_is_better: true
  - metric: pivot
    aggregation: mean
    higher_is_better: true
  - metric: no_inversion
    aggregation: mean
    higher_is_better: true
  - metric: fact_a
    aggregation: mean
    higher_is_better: true
  - metric: fact_b
    aggregation: mean
    higher_is_better: true
  - metric: exclusive
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
