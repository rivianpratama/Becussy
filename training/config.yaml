# Single source of truth for the Becussy QLoRA run.
# Turing sm75 hard rules: fp16 only, 4-bit NF4 only, gradient checkpointing on,
# micro_batch x seq <= ~4k tokens (fp32-logits spike at vocab 151,936).

# Loader target: Unsloth's NF4-prequantized mirror of the canonical base
# model. Unsloth redirects load_in_4bit for Qwen/Qwen3-4B-Instruct-2507 to this
# repo anyway, so we name it explicitly and pin its immutable commit — the only
# revision that actually reproduces the loaded weights (report P1 #5).
base_model: Qwen/Qwen3-4B-Instruct-2507   # canonical identity (paper, tokenizer)
model: unsloth/Qwen3-4B-Instruct-2507-unsloth-bnb-4bit
model_revision: 7744afa8566e264af1a92a806d8d9aae00cc7c78
load_in_4bit: true            # NF4. NEVER 8-bit (unsloth issue #3501 for this model)
dtype: float16                # no bf16 on Turing, ever
max_seq_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 3
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 5
  seed: 3407

checkpointing:
  save_steps: 60                      # ~119 steps/epoch -> ~0.5-epoch cadence
  save_total_limit: 8

paths:
  # Repo-relative (resolved against the repo root in train.py) — no machine
  # path assumptions. output_dir is intentionally external (WSL ext4, NOT
  # /mnt/c, whose 9P I/O kills checkpoint saves) and stays configurable.
  train: dataset/final/train.jsonl
  val: dataset/final/val.jsonl
  output_dir: ~/becussy_runs/run01
