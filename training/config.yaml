# Single source of truth for the Becussy QLoRA run.
# Turing sm75 hard rules: fp16 only, 4-bit NF4 only, gradient checkpointing on,
# micro_batch x seq <= ~4k tokens (fp32-logits spike at vocab 151,936).

model: Qwen/Qwen3-4B-Instruct-2507
load_in_4bit: true            # NF4. NEVER 8-bit (unsloth issue #3501 for this model)
dtype: float16                # no bf16 on Turing, ever
max_seq_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 3
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 5
  seed: 3407

checkpointing:
  save_steps: 60                      # ~119 steps/epoch -> ~0.5-epoch cadence
  save_total_limit: 8

paths:
  train: /mnt/c/Users/Rivian/Documents/GitHub/Becussy/dataset/final/train.jsonl
  val: /mnt/c/Users/Rivian/Documents/GitHub/Becussy/dataset/final/val.jsonl
  output_dir: ~/becussy_runs/run01    # WSL ext4 — NOT /mnt/c (9P I/O kills checkpoint saves)
